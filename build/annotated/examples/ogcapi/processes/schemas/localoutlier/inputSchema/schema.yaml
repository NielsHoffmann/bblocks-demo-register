type: object
required:
- dataset
properties:
  dataset:
    type: string
    format: url
  n_neighbors:
    oneOf:
    - type: integer
    default: 20
    x-jsonld-id: https://purl.stelselcatalogus.nl/id/mkg/BRTkenmerk_nummer-inrichtingselement
  leaf_size:
    oneOf:
    - type: integer
    default: 30
    x-jsonld-id: http://definities.geostandaarden.nl/nen3610-2022/id/begrip/verkeerruimte
  output_column:
    oneOf:
    - type: string
    default: abnormality
