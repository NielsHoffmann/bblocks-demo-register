type: object
description: Query parameters for retrieving log records within a time interval.
properties:
  start_time:
    type: string
    format: date-time
    description: Start of the time interval.
  end_time:
    type: string
    format: date-time
    description: End of the time interval.
additionalProperties: false
anyOf:
- required:
  - start_time
- required:
  - end_time
